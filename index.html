<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ LØGHØST - نظام التحكم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ===== خلفية متحركة ===== */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 0, 0, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0, 255, 0, 0.04) 0%, transparent 60%),
                linear-gradient(180deg, #0a0a0a 0%, #1a0a0a 50%, #0a0a0a 100%);
            z-index: 0;
        }

        /* ===== خطوط المصفوفة ===== */
        .matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.15;
        }

        .matrix span {
            position: absolute;
            color: #00ff41;
            font-size: 14px;
            font-weight: 700;
            animation: matrixDrop 10s linear infinite;
            text-shadow: 0 0 10px #00ff41;
        }

        @keyframes matrixDrop {
            0% { transform: translateY(-100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        /* ===== الحاوية ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 90%;
            padding: 40px 30px;
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 20px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.05), inset 0 0 60px rgba(255, 0, 0, 0.02);
            text-align: center;
        }

        /* ===== الشعار ===== */
        .logo {
            font-size: 60px;
            color: #ff0040;
            text-shadow: 0 0 40px rgba(255, 0, 64, 0.3), 0 0 80px rgba(255, 0, 64, 0.1);
            margin-bottom: 5px;
            animation: pulseLogo 3s ease-in-out infinite;
        }

        @keyframes pulseLogo {
            0%, 100% { text-shadow: 0 0 40px rgba(255, 0, 64, 0.3); }
            50% { text-shadow: 0 0 80px rgba(255, 0, 64, 0.5); }
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            color: #ff0040;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 0, 64, 0.2);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-family: 'Cairo', sans-serif;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Cairo', sans-serif;
        }

        .status-item .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.2s infinite;
        }

        .status-item .dot.green { background: #00ff41; box-shadow: 0 0 10px #00ff41; }
        .status-item .dot.red { background: #ff0040; box-shadow: 0 0 10px #ff0040; animation-delay: 0.5s; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ===== الأزرار ===== */
        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links .btn {
            padding: 14px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: 0.4s;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Cairo', sans-serif;
            border: 1px solid;
            min-width: 160px;
        }

        .btn-target {
            background: rgba(255, 0, 64, 0.05);
            border-color: rgba(255, 0, 64, 0.3);
            color: #ff0040;
            text-shadow: 0 0 20px rgba(255, 0, 64, 0.1);
        }

        .btn-target:hover {
            background: rgba(255, 0, 64, 0.15);
            border-color: #ff0040;
            box-shadow: 0 0 40px rgba(255, 0, 64, 0.1);
            transform: scale(1.03);
        }

        .btn-dashboard {
            background: rgba(0, 255, 65, 0.05);
            border-color: rgba(0, 255, 65, 0.2);
            color: #00ff41;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .btn-dashboard:hover {
            background: rgba(0, 255, 65, 0.12);
            border-color: #00ff41;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.1);
            transform: scale(1.03);
        }

        /* ===== التذييل ===== */
        .footer {
            margin-top: 25px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.05);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Cairo', sans-serif;
        }

        .footer span {
            color: #ff0040;
            opacity: 0.3;
        }

        /* ===== شريط التحميل ===== */
        .scan-line {
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff0040, transparent);
            margin: 15px auto;
            opacity: 0.3;
            animation: scan 3s ease-in-out infinite;
        }

        @keyframes scan {
            0% { width: 20%; opacity: 0.1; }
            50% { width: 80%; opacity: 0.4; }
            100% { width: 20%; opacity: 0.1; }
        }

        /* ===== التجاوب ===== */
        @media (max-width: 500px) {
            .container { padding: 25px 15px; }
            .title { font-size: 22px; }
            .logo { font-size: 40px; }
            .links .btn { padding: 12px 20px; font-size: 12px; min-width: 130px; }
            .status-bar { gap: 12px; }
        }
    </style>
</head>
<body>

    <!-- ===== الخلفية ===== -->
    <div class="bg"></div>

    <!-- ===== خطوط المصفوفة ===== -->
    <div class="matrix" id="matrix"></div>

    <!-- ===== المحتوى ===== -->
    <div class="container">

        <div class="logo">⌘</div>
        <div class="title">LØGHØST</div>
        <div class="subtitle">⟡ نظام التحكم عن بعد ⟡</div>

        <div class="status-bar">
            <div class="status-item"><span class="dot green"></span> النظام نشط</div>
            <div class="status-item"><span class="dot red"></span> جاهز للاستهداف</div>
            <div class="status-item" style="color:rgba(255,255,255,0.1);">⬤ ENCRYPTED</div>
        </div>

        <div class="scan-line"></div>

        <div class="links">
            <a href="target.html" class="btn btn-target">🎯 استهداف</a>
            <a href="dashboard.html" class="btn btn-dashboard">🎮 تحكم</a>
        </div>

        <div class="footer">
            <span>✦</span> نظام آمن <span>✦</span> مشفر بالكامل <span>✦</span>
        </div>

    </div>

    <script>
        // ===== خطوط المصفوفة =====
        (function() {
            const matrix = document.getElementById('matrix');
            const chars = '0123456789ABCDEF';
            const count = 40;

            for (let i = 0; i < count; i++) {
                const span = document.createElement('span');
                span.textContent = chars[Math.floor(Math.random() * chars.length)];
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = (8 + Math.random() * 12) + 's';
                span.style.animationDelay = (Math.random() * 10) + 's';
                span.style.fontSize = (10 + Math.random() * 12) + 'px';
                span.style.opacity = 0.1 + Math.random() * 0.2;
                matrix.appendChild(span);
            }
        })();
    </script>

</body>
</html>
